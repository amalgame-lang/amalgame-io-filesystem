[package]
name              = "amalgame-io-filesystem"
version           = "0.2.0"
license           = "Apache-2.0"
description       = "Filesystem operations for Amalgame the bundled File facade is missing. Enumeration: Filesystem.List(dir), IsDir / IsFile, ListRecursive(root) (DFS). Mutation: MakeDir (mkdir -p), Remove (rm -rf, recursive + idempotent), Move (rename). POSIX opendir/readdir/mkdir/rmdir + Windows FindFirstFile/_mkdir/RemoveDirectory behind a thin @c frontier; recursion and path handling are pure Amalgame."
required-amalgame = ">=0.8.58"
schema-version    = 1

[stdlib]
class     = "Filesystem"
header    = "facade-stub.h"
namespace = "Amalgame.IO.Filesystem"
facade    = "facade.am"
libs      = []
